# Gera a cobrinha que "come" o gráfico de contribuições e publica os SVGs na branch output.
name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza duas vezes por dia
  workflow_dispatch:          # permite rodar pelo botão "Run workflow"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar os SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
